services:
  app:
    build:
      context: ./noctua-api
      dockerfile: ../Dockerfile
    container_name: noctua-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./noctua-api:/var/www/html
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=noctua
      - DB_USERNAME=noctua
      - DB_PASSWORD=noctua_secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
    networks:
      - noctua-network


  # Contenedor objetivo del laboratorio (issue #9) — superficie CWE-78 aislada.
  # Deriva de la imagen de `app` pero SIN el socket de Docker, como no-root y
  # con limites. La ruta vulnerable solo existe aqui (APP_ENV=lab + bandera).
  # Perfil "lab": no arranca en un `docker compose up` normal.
  lab-target:
    profiles: ["lab"]
    build:
      context: ./noctua-api
      dockerfile: ../Dockerfile
    container_name: noctua-lab-target
    restart: unless-stopped
    user: www-data
    command: >
      sh -c "php artisan config:clear && php artisan serve --env=lab --host=0.0.0.0 --port=8000"
    expose:
      - "8000"
    volumes:
      - ./noctua-api:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=lab
      - APP_DEBUG=false
      - UMBRA_LAB_ENABLED=true
      - UMBRA_DETECTOR_URL=http://detector:8001/analizar
      - UMBRA_FAIL_MODE=closed
      - NOCTUA_CONTAINER_PROVISIONING=false
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=noctua
      - DB_USERNAME=noctua
      - DB_PASSWORD=noctua_secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    mem_limit: 512m
    pids_limit: 128
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - noctua-network


  db:
    image: postgres:17-alpine
    container_name: noctua-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: noctua
      POSTGRES_USER: noctua
      POSTGRES_PASSWORD: noctua_secret
    volumes:
      - noctua-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noctua"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - noctua-network

  redis:
    image: redis:7-alpine
    container_name: noctua-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - noctua-network

  mysql:
    image: mysql:8
    container_name: noctua-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: noctua_mysql_root_secret
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress_secret
    volumes:
      - noctua-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pnoctua_mysql_root_secret"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - noctua-network

  horizon:
    build:
      context: ./noctua-api
      dockerfile: ../Dockerfile
    container_name: noctua-horizon
    restart: unless-stopped
    command: php artisan horizon
    volumes:
      - ./noctua-api:/var/www/html
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=local
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=noctua
      - DB_USERNAME=noctua
      - DB_PASSWORD=noctua_secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
    networks:
      - noctua-network

  scheduler:
    build:
      context: ./noctua-api
      dockerfile: ../Dockerfile
    container_name: noctua-scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    volumes:
      - ./noctua-api:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=local
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=noctua
      - DB_USERNAME=noctua
      - DB_PASSWORD=noctua_secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
    networks:
      - noctua-network

  load-generator:
    build:
      context: ./docker/load-generator
    container_name: noctua-load-generator
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - noctua-network
    depends_on:
      - app

volumes:
  noctua-db-data:
  noctua-mysql-data:

networks:
  noctua-network:
    driver: bridge